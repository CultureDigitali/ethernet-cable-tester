[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethernet-cable-tester"
version = "0.1.0"
description = "Cross-platform Ethernet link and LAN benchmark diagnostic utility"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "mypy>=1.10,<2",
  "PyInstaller>=6.21,<7",
  "types-psutil>=5.9,<8",
]

[project.scripts]
ethernet-cable-tester = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]
